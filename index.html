<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세포막을 통한 물질 출입 시뮬레이션</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; display: flex; flex-direction: column; align-items: center; padding: 20px 12px; }
    header { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 1.6rem; color: #0f172a; margin-bottom: 4px; }
    .subtitle { font-size: 0.95rem; color: #64748b; }

    .main-wrap { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1220px; width: 100%; }
    
    .canvas-card {
      background: white;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
      border: 1px solid #cbd5e1;
    }
    canvas { display: block; border-radius: 8px; }

    .control-panel {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
      border: 1px solid #cbd5e1;
    }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-weight: 700; font-size: 0.85rem; color: #334155; }
    select, button {
      padding: 9px 12px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      font-size: 0.9rem;
      cursor: pointer;
    }
    select { background-color: #f8fafc; outline: none; }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background-color: #0369a1; }

    .card-box {
      background-color: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      font-size: 0.85rem;
      line-height: 1.55;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .legend-icon { width: 14px; height: 14px; display: inline-block; }
    .legend-circle { border-radius: 50%; }
    .legend-hex { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }

    .desc-box {
      font-size: 0.83rem;
      line-height: 1.5;
      color: #334155;
      background: #eff6ff;
      padding: 12px;
      border-left: 4px solid #0284c7;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>세포막 물질 출입 시뮬레이션</h1>
    <div class="subtitle">인지질 이중층의 선택적 투과성과 수송 단백질의 특이성</div>
  </header>

  <div class="main-wrap">
    <div class="canvas-card">
      <canvas id="simCanvas" width="850" height="480"></canvas>
    </div>

    <div class="control-panel">
      <div class="control-group">
        <label for="modeSelect">시뮬레이션 모드</label>
        <select id="modeSelect">
          <option value="all">통합 관찰 모드 (교과서 종합)</option>
          <option value="simple">1. 단순 확산 (산소/소수성 분자)</option>
          <option value="carrier">2. 촉진 확산 - 운반체단백질 (포도당 vs 과당)</option>
          <option value="channel">3. 촉진 확산 - 통로단백질 (이온 채널)</option>
          <option value="active">4. 능동 수송 (ATP 펌프 역방향)</option>
        </select>
      </div>

      <div class="control-group">
        <button id="resetBtn">시뮬레이션 리셋</button>
      </div>

      <div class="card-box" id="legendBox"></div>

      <div class="card-box">
        <strong>구역별 입자 수치</strong><br>
        세포 밖 (상단): <span id="outsideCount" style="font-weight: 700; color: #0284c7;">0</span>개<br>
        세포 안 (하단): <span id="insideCount" style="font-weight: 700; color: #d97706;">0</span>개
      </div>

      <div class="desc-box" id="modeDesc"></div>
    </div>
  </div>

  <script src="simulation.js?v=5"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세포막 물질 이동 시뮬레이션</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
    h1 { margin-bottom: 8px; font-size: 1.6rem; color: #0f172a; }
    .subtitle { margin-bottom: 20px; font-size: 0.95rem; color: #64748b; }
    .container { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; max-width: 1050px; width: 100%; }
    canvas { background-color: #ffffff; border: 2px solid #cbd5e1; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
    .control-panel { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); width: 340px; display: flex; flex-direction: column; gap: 16px; }
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-weight: 700; font-size: 0.9rem; color: #334155; }
    select, button { padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.95rem; cursor: pointer; }
    select { background-color: #f8fafc; }
    button { background-color: #2563eb; color: white; border: none; font-weight: 600; transition: background 0.2s; }
    button:hover { background-color: #1d4ed8; }
    .legend { background-color: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 0.85rem; line-height: 1.6; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .stats { font-size: 0.85rem; line-height: 1.6; background-color: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .desc-box { font-size: 0.85rem; line-height: 1.5; color: #475569; background: #eff6ff; padding: 12px; border-left: 4px solid #3b82f6; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>세포막 물질 수송 시뮬레이터</h1>
  <div class="subtitle">선택적 투과성, 기질 특이성, 능동 수송 및 삼투 현상 관찰</div>

  <div class="container">
    <canvas id="simCanvas" width="620" height="460"></canvas>
    
    <div class="control-panel">
      <div class="control-group">
        <label for="modeSelect">수송 모드 선택</label>
        <select id="modeSelect">
          <option value="simple">1. 단순 확산 (지용성/기체 vs 극성/대형 분자)</option>
          <option value="facilitated">2. 촉진 확산 (포도당 vs 특이성 없는 과당)</option>
          <option value="active">3. 능동 수송 (ATP 펌프 역방향 수송)</option>
          <option value="osmosis">4. 삼투 현상 (용질 농도차와 빠른 물 이동)</option>
        </select>
      </div>

      <div class="control-group">
        <button id="resetBtn">시뮬레이션 재시작</button>
      </div>

      <div class="legend" id="legendBox"></div>

      <div class="stats">
        <strong>구역별 입자 수치</strong><br>
        세포 밖 (상단): <span id="outsideCount" style="font-weight: bold; color: #2563eb;">0</span>개<br>
        세포 안 (하단): <span id="insideCount" style="font-weight: bold; color: #16a34a;">0</span>개
      </div>

      <div class="desc-box" id="modeDesc"></div>
    </div>
  </div>

  <!-- 캐시 방지를 위해 ?v=2 추가 -->
  <script src="simulation.js?v=2"></script>
</body>
</html>
